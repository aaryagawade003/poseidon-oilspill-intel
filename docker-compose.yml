services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      VITE_POSEIDON_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
